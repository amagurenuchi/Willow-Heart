[ScreenTitleMenu]
HeaderTitle="Welcome Back"
ShowHeader=true
ChoiceNames="GameStart,Options,PackDownloader,GameSelect,AV,Exit"
ChoiceGameStart="applydefaultoptions;text,Game Start;screen,"..Branch.AfterTitleMenu()
ChoiceOptions="screen,ScreenOptionsService;text,Options"
ChoicePackDownloader="screen,ScreenPackDownloader;text,PackDownloader"
ChoiceGameSelect="screen,ScreenSelectGame;text,Select Game"
ChoiceAV="text,Editor;lua,ShowEditorSite"
ChoiceExit="screen,ScreenExit;text,Exit"

ChoiceX=SCREEN_WIDTH - 20
ChoiceY=SCREEN_CENTER_Y + 20
ChoiceTransformFunction=function(self,offset,itemIndex,numItems) self:x(0):y((itemIndex - (numItems-1)/2) * 50):halign(1):diffuse(color("#000000")):diffusealpha(1) end
ScrollerX=SCREEN_WIDTH - 20
ScrollerY=SCREEN_CENTER_Y + 20
ScrollerTransform=function(self,offset,itemIndex,numItems) self:x(0):y((itemIndex - (numItems-1)/2) * 50) end

